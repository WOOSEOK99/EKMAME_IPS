<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c16">
  <meta name="description" content="MDK.CAB, Emu-Land, RomsDL의 MAME 검색 결과를 한곳에서 보고 실제 게임 상세 페이지로 이동합니다">
  <title>Arcade Finder — 실제 MAME 게임 검색</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0c16; --panel:#141625; --panel2:#191b2c; --line:#2c2e46; --text:#f4f4fb; --muted:#a5a7bd; --lime:#d1f775; --violet:#b7a2ff; --coral:#ff9c88; --cyan:#8bd9e4; --shadow:0 22px 70px rgba(0,0,0,.32) }
    * { box-sizing:border-box }
    html { scroll-behavior:smooth }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse 45% 40% at 85% 12%, #30244d55 0, transparent 85%), radial-gradient(ellipse 37% 30% at 6% 56%, #1a384155 0, transparent 90%), var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.5 }
    button,input { font:inherit }
    button { cursor:pointer }
    a { color:inherit; text-decoration:none }
    a:focus-visible,button:focus-visible,input:focus-visible { outline:3px solid var(--lime); outline-offset:3px }
    .wrap { width:min(1080px,calc(100% - 40px)); margin:0 auto }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:28px 0; border-bottom:1px solid #ffffff14 }
    .brand { display:flex; align-items:center; gap:12px; font-weight:850; letter-spacing:.02em; font-size:17px }
    .brand-mark { display:grid; place-items:center; width:36px; height:36px; border-radius:10px; background:var(--lime); color:#111322; box-shadow:0 0 20px #d1f77535; font-size:20px; font-weight:900 }
    .top-pill { border:1px solid var(--line); border-radius:99px; font-size:12px; color:#b9bbd0; padding:7px 12px; letter-spacing:.11em; font-weight:750 }
    main { max-width:860px; margin:0 auto; padding:70px 0 110px }
    .eyebrow { display:flex; align-items:center; gap:10px; color:var(--lime); font-size:12px; letter-spacing:.23em; font-weight:850; text-transform:uppercase }
    .eyebrow:before { content:""; width:23px; height:2px; background:var(--lime) }
    h1 { font-size:clamp(32px,5vw,46px); letter-spacing:-.05em; line-height:1.2; margin:0 0 28px; font-weight:850 }
    h1 em { font-style:normal; color:var(--lime) }
    .intro { max-width:660px; color:#b5b6cc; margin:0 0 44px; font-size:16px; line-height:1.9 }
    .searchbox { background:#181a2b; border:1px solid #41445c; border-radius:22px; padding:10px; box-shadow:var(--shadow); display:flex; gap:10px; align-items:center; transition:border-color .2s }
    .searchbox:focus-within { border-color:#d1f77599 }
    .search-icon { color:var(--lime); margin-left:14px; flex:none }
    .searchbox input { background:none; border:0; color:var(--text); width:100%; min-width:0; padding:16px 5px; outline:none; font-size:19px; font-weight:550 }
    .searchbox input::placeholder { color:#757991; font-weight:400 }
    .primary { background:var(--lime); color:#111421; border:0; border-radius:14px; padding:18px 27px; white-space:nowrap; font-size:15px; font-weight:850; transition:transform .15s,background .15s }
    .primary:hover { background:#e5ffaf; transform:translateY(-1px) }
    .below-input { display:flex; gap:10px 20px; align-items:center; flex-wrap:wrap; margin:16px 2px 38px; color:var(--muted); font-size:13px }
    .chips { display:flex; gap:8px; flex-wrap:wrap }
    .chip { background:#202235; border:1px solid #35384e; color:#c8c9d6; border-radius:8px; padding:6px 10px; font-size:12px; transition:background .15s }
    .chip:hover { background:#30344f }
    .panel { background:linear-gradient(155deg,#1a1c2e,#111321); border:1px solid #36394e; border-radius:24px; padding:28px; box-shadow:var(--shadow) }
    .panel-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap }
    .section-kicker { font-size:11px; letter-spacing:.16em; color:#9699b4; font-weight:850; text-transform:uppercase; margin:0 0 8px }
    h2 { font-size:24px; line-height:1.35; letter-spacing:-.035em; margin:0; font-weight:800 }
    .site-count { color:var(--muted); font-size:13px }
    .sites { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:25px }
    .site { position:relative; background:#212337; border:1px solid #353750; border-radius:16px; padding:20px; min-height:188px; transition:transform .15s,border-color .15s }
    .site:hover { transform:translateY(-2px); border-color:#636681 }
    .site-top { display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:30px }
    .site-logo { display:grid; place-items:center; width:39px; height:39px; border-radius:11px; font-size:14px; font-weight:900; letter-spacing:-.04em }
    .mdk .site-logo { background:#352f50; color:var(--violet) }
    .emu .site-logo { background:#45303b; color:var(--coral) }
    .roms .site-logo { background:#21404a; color:var(--cyan) }
    .check { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); cursor:pointer; user-select:none }
    .check input { accent-color:var(--lime); width:16px; height:16px; margin:0 }
    .site h3 { font-size:18px; margin:0 0 5px; letter-spacing:-.025em }
    .site p { font-size:12px; margin:0; color:var(--muted) }
    .divider { border:0; border-top:1px solid #36384d; margin:26px 0 22px }
    .action-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap }
    .secondary { background:#303347; border:1px solid #4a4d63; border-radius:12px; color:#f0f1f8; padding:13px 18px; font-weight:750; font-size:13px; transition:background .15s }
    .secondary:hover { background:#42465f }
    .fineprint { font-size:12px; color:#8589a1; line-height:1.7; flex:1; min-width:230px }
    .results { margin-top:26px; display:none }
    .results.active { display:block; animation:rise .25s ease-out }
    @keyframes rise { from { opacity:0; transform:translateY(9px) } to { opacity:1; transform:translateY(0) } }
    .result-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px }
    .result-top strong { font-size:18px }
    .querytag { border-radius:7px; background:#2a3041; color:var(--lime); font-size:14px; padding:4px 8px; font-family:ui-monospace,monospace }
    .result-list { display:grid; gap:10px }
    .source-group { border:1px solid #3d4057; background:#181a2a; border-radius:15px; overflow:hidden }
    .source-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:14px 17px; border-bottom:1px solid #34374d; background:#222438 }
    .source-head strong { font-size:14px; color:#f1f1f8 }
    .source-head .source-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:#a0a4bd; font-size:12px }
    .source-head a { color:var(--lime); font-size:12px; text-decoration:underline; text-underline-offset:3px }
    .game { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:16px 18px; border:1px solid #383b51; background:#181a2a; border-radius:12px }
    .game h4 { font-size:14px; line-height:1.5; margin:0 0 6px; font-weight:710; word-break:keep-all }
    .game-meta { display:flex; flex-wrap:wrap; gap:7px; align-items:center; color:#aaaec3; font-size:11px }
    .rom-id { font-family:ui-monospace,SFMono-Regular,monospace; color:#d5f68b; border-radius:6px; background:#31384a; padding:2px 6px }
    .game a { display:inline-flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; border:1px solid #6c8e54; border-radius:8px; color:#d9ff9a; background:#2b3a2b; font-size:12px; font-weight:800; padding:9px 12px }
    .game a:hover { background:#3d5438 }
    .empty,.error,.loading { color:#aaaec6; padding:25px 18px; font-size:13px; line-height:1.75 }
    .error { color:#ffb0a1 }
    .loading:before { content:""; display:inline-block; width:12px; height:12px; border:2px solid #5a645a; border-top-color:var(--lime); border-radius:50%; animation:spin .8s linear infinite; margin-right:10px; vertical-align:-3px }
    @keyframes spin { to { transform:rotate(360deg) } }
    .caution { display:flex; align-items:flex-start; gap:12px; border:1px solid #3b3d53; border-radius:12px; padding:14px 16px; margin-top:15px; color:#aeb0c4; font-size:12px; line-height:1.75 }
    .caution b { color:#e3e4f4 }
    .more { margin-top:66px; display:grid; grid-template-columns:1fr 1fr; gap:38px; padding:0 4px }
    .more h2 { font-size:19px; margin-bottom:14px }
    .more p,.more li { font-size:13px; color:#a5a8bf; line-height:1.85 }
    .more ul { margin:0; padding-left:20px }
    .more li+li { margin-top:5px }
    .recent { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px }
    .recent button { border:1px solid #393d54; color:#ccd0df; background:#191c2c; border-radius:7px; font-size:12px; padding:7px 10px }
    footer { padding:25px 0 36px; border-top:1px solid #26283a; display:flex; justify-content:space-between; gap:12px; color:#777b95; font-size:11px; flex-wrap:wrap }
    @media(max-width:740px) { main { padding:44px 0 75px } .searchbox { flex-wrap:wrap } .searchbox input { flex:1; font-size:16px } .primary { width:100%; padding:14px } .wrap { width:min(100% - 28px,1080px) } .game { align-items:flex-start; flex-direction:column; gap:12px } }
    @media(prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important; scroll-behavior:auto!important } }
  </style>
</head>
<body>
  <div class="wrap">
    <main>
      <h1>MAME ROM 검색</h1>
      <form id="search-form" class="searchbox" autocomplete="off">
        <svg class="search-icon" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.3 16.3 5 5"/></svg>
        <input id="query" type="search" maxlength="100" aria-label="게임명 또는 ROM ID" placeholder="게임명 또는 ROM ID (예: sfiii3)" required spellcheck="false" autofocus>
        <button class="primary" type="submit" id="search-submit">검색</button>
      </form>
      <div class="results" id="results" aria-live="polite"><div class="result-top"><strong>검색 결과 <span class="querytag" id="querytag"></span></strong><span class="site-count" id="result-count"></span></div><div class="result-list" id="result-list"></div></div>
    </main>
  </div>
  <script>
    (() => {
      const input = document.getElementById('query');
      const form = document.getElementById('search-form');
      const results = document.getElementById('results');
      const resultList = document.getElementById('result-list');
      const queryTag = document.getElementById('querytag');
      const sites = ['mdk','emu','roms'];
      let controller = null;
      const submit = document.getElementById('search-submit');
      function cleanQuery() { return input.value.trim().replace(/\s+/g,' ').slice(0,100); }
      function safeLink(url) {
        try { const u=new URL(url); return u.protocol==='https:' && ['mdk.cab','www.emu-land.net','romsdl.com'].includes(u.hostname) ? u.href : null; }
        catch { return null; }
      }
      function renderResult(data) {
        resultList.replaceChildren();
        let total=0, failed=0;
        for(const site of sites) {
          const source=data.sources?.[site];
          if(!source || source.status==='error') { failed++; continue; }
          for(const game of source.items || []) {
            const gameUrl=safeLink(game.url);if(!gameUrl)continue;
            const row=document.createElement('article');row.className='game';
            const content=document.createElement('div');
            const gameTitle=document.createElement('h4');gameTitle.textContent=game.title;
            const meta=document.createElement('div');meta.className='game-meta';
            if(game.id){const id=document.createElement('span');id.className='rom-id';id.textContent=game.id;meta.append(id);}
            if(game.platform){const platform=document.createElement('span');platform.textContent=game.platform;meta.append(platform);}
            content.append(gameTitle,meta);
            const link=document.createElement('a');link.href=gameUrl;link.target='_blank';link.rel='noopener noreferrer';link.textContent='상세 페이지 ↗';
            row.append(content,link);resultList.append(row);
            total++;
          }
        }
        if(!total) {
          const box=document.createElement('div');box.className=failed===sites.length?'error':'empty';
          box.textContent=failed===sites.length?'검색 결과를 가져오지 못했습니다. 잠시 후 다시 시도해 주세요.':'검색 결과가 없습니다.';
          resultList.append(box);
        } else if(failed) {
          const box=document.createElement('div');box.className='empty';box.textContent='일부 검색 결과를 가져오지 못했습니다.';resultList.append(box);
        }
        document.getElementById('result-count').textContent=`${total}개 결과`;
      }
      async function runSearch(q) {
        if(!q)return;
        controller?.abort();
        const active=new AbortController();controller=active;
        queryTag.textContent=q;
        results.classList.add('active');
        resultList.replaceChildren();
        const loading=document.createElement('div');loading.className='loading';loading.textContent='검색 중입니다...';
        resultList.append(loading);
        document.getElementById('result-count').textContent='검색 중';
        submit.disabled=true;submit.textContent='검색 중...';
        try {
          const apiOrigin=location.origin==='https://wooseok99.github.io'
            ? 'https://arcade-rom-search-2026.rosy-ash-6331.chatgpt.site' : '';
          const url=apiOrigin+'/api/search?q='+encodeURIComponent(q);
          const response=await fetch(url,{signal:active.signal});
          const data=await response.json();
          if(!response.ok)throw new Error(data.error || '검색 서버 오류');
          if(controller===active)renderResult(data);
        } catch(error) {
          if(error.name!=='AbortError'&&controller===active){
            resultList.replaceChildren();
            const box=document.createElement('div');box.className='error';box.textContent='검색 요청 실패: '+error.message;resultList.append(box);
            document.getElementById('result-count').textContent='오류';
          }
        } finally {
          if(controller===active){submit.disabled=false;submit.textContent='검색';}
        }
      }
      form.addEventListener('submit',e=>{e.preventDefault();runSearch(cleanQuery());});
      const urlQuery=new URLSearchParams(location.search).get('q');if(urlQuery){input.value=urlQuery.slice(0,100);runSearch(cleanQuery());}
    })();
  </script>
</body>
</html>
